services:
  postgres:
    image: postgres:16
    container_name: postgres_agrosoft
    restart: always
    environment:
      POSTGRES_DB: db_agrosoft
      POSTGRES_USER: agrosoft
      POSTGRES_PASSWORD: agrosoft123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  pgdata: