<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD Usuarios</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

  <div class="max-w-3xl mx-auto bg-white shadow rounded-lg p-6">
    <h1 class="text-2xl font-bold mb-4 text-gray-800">CRUD de Usuarios</h1>

    <!-- Formulario -->
    <form id="form-usuario" class="mb-6 space-y-3">
      <input type="hidden" id="id" />

      <input
        type="text"
        id="nombre"
        placeholder="Nombre"
        required
        class="border rounded p-2 w-full"
      />

      <input
        type="email"
        id="email"
        placeholder="Email"
        required
        class="border rounded p-2 w-full"
      />

      <input
        type="text"
        id="rol"
        placeholder="Rol"
        class="border rounded p-2 w-full"
      />

q       <div class="flex gap-2">
        <button
          type="submit"
          id="btn-guardar"
          class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded"
        >
          Guardar
        </button>
        <button
          type="button"
          id="btn-cancelar"
          class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded hidden"
        >
          Cancelar
        </button>
      </div>
    </form>

    <!-- Tabla -->
    <table class="table-auto w-full border-collapse">
      <thead>
        <tr class="bg-gray-200 text-left">
          <th class="p-2">Nombre</th>
          <th class="p-2">Email</th>
          <th class="p-2">Rol</th>
          <th class="p-2">Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-usuarios">
        <!-- Filas generadas dinámicamente -->
      </tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
