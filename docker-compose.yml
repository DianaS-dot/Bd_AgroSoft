services:
  postgres:
    image: postgres:16
    container_name: agrosoft-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - agrosoft_data:/var/lib/postgresql/data

volumes:
  agrosoft_data: