version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: agrosoft-postgres
    restart: always
    environment:
      POSTGRES_USER: agrosoft
      POSTGRES_PASSWORD: agrosoft123
      POSTGRES_DB: db_agrosoft
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrosoft"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
